services:
  - type: web
    name: hello-madurai
    runtime: node
    region: singapore
    plan: free
    rootDir: Hello-Madurai/hello-madurai-app
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: admin123
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://hello-madurai.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: your-supabase-url
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: your-supabase-anon-key
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: your-supabase-service-role-key


